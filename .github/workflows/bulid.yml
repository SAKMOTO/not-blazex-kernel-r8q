name: Build Samsung S20 FE Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install required tools
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          python3 \
          python-is-python3

    - name: Build everything (WITH INITRAMFS DISABLED)
      run: |
        # Clean first
        make clean
        make mrproper
        
        # Load defconfig WITH ARCH
        make ARCH=arm64 not_defconfig
        
        # Fix config - DISABLE problem features
        scripts/config --disable CONFIG_EFI
        scripts/config --disable CONFIG_EFI_STUB
        scripts/config --disable CONFIG_QCLD
        scripts/config --disable CONFIG_ARM64_VDSO
        scripts/config --disable CONFIG_BLK_DEV_INITRD
        scripts/config --disable CONFIG_INITRAMFS_SOURCE
        scripts/config --disable CONFIG_RD_GZIP
        scripts/config --disable CONFIG_RD_BZIP2
        scripts/config --disable CONFIG_RD_LZMA
        scripts/config --disable CONFIG_RD_XZ
        scripts/config --disable CONFIG_RD_LZO
        scripts/config --disable CONFIG_RD_LZ4
        
        make ARCH=arm64 olddefconfig
        
        # Build kernel WITHOUT initramfs
        make -j$(nproc) \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Verify image
      run: |
        if [ -f arch/arm64/boot/Image ]; then
          echo "✅ Kernel build successful"
          ls -lh arch/arm64/boot/Image
        elif [ -f arch/arm64/boot/Image.gz ]; then
          echo "✅ Kernel build successful (Image.gz)"
          ls -lh arch/arm64/boot/Image.gz
        else
          echo "❌ Build failed - no kernel image found"
          ls -lh arch/arm64/boot/ || echo "Boot directory not found"
          exit 1
        fi

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1
        if [ -f arch/arm64/boot/Image ]; then
          cp arch/arm64/boot/Image AnyKernel3/
        elif [ -f arch/arm64/boot/Image.gz ]; then
          cp arch/arm64/boot/Image.gz AnyKernel3/
        fi
        cd AnyKernel3
        zip -r9 ../kernel.zip *

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-artifacts
        path: |
          kernel.zip
          arch/arm64/boot/Image*
        retention-days: 7
