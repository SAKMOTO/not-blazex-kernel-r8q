name: Build S20 FE Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install build tools
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential curl flex git
        sudo apt install -y libelf-dev libssl-dev libncurses5-dev lz4
        sudo apt install -y python3 python3-pip wget zip
        
        # Install newer LLVM/Clang (CRITICAL FIX)
        wget https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
        tar -xf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
        mv clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04 clang-17
        
        # Install aarch64 gcc
        sudo apt install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Find defconfig
      id: find-config
      run: |
        echo "🔍 Finding defconfig..."
        
        # Most common S20 FE defconfig
        DEFCONFIG=""
        
        # Try common locations
        if [ -f "arch/arm64/configs/vendor/sm7225-sec_defconfig" ]; then
          DEFCONFIG="vendor/sm7225-sec_defconfig"
        elif [ -f "arch/arm64/configs/sm7225-sec_defconfig" ]; then
          DEFCONFIG="sm7225-sec_defconfig"
        elif [ -f "arch/arm64/configs/vendor/r8q_defconfig" ]; then
          DEFCONFIG="vendor/r8q_defconfig"
        else
          # List available defconfigs
          echo "Available defconfigs:"
          find arch/arm64/configs -name "*defconfig" 2>/dev/null | head -20
          
          # Use first available
          DEFCONFIG=$(find arch/arm64/configs -name "*defconfig" 2>/dev/null | head -1)
          DEFCONFIG=${DEFCONFIG#arch/arm64/configs/}
        fi
        
        if [ -z "$DEFCONFIG" ]; then
          echo "❌ No defconfig found!"
          exit 1
        fi
        
        echo "✅ Using defconfig: $DEFCONFIG"
        echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_OUTPUT

    - name: Build kernel (FIXED TOOLCHAIN)
      env:
        KERNEL_CONFIG: ${{ steps.find-config.outputs.DEFCONFIG }}
      run: |
        echo "🚀 Building kernel with config: $KERNEL_CONFIG"
        
        # Set environment
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Clean
        make clean 2>/dev/null || true
        make mrproper 2>/dev/null || true
        
        # Load config
        make ARCH=arm64 $KERNEL_CONFIG
        
        # Build with NEW Clang 17 (FIX for --no-warn-rwx-segments error)
        echo "Using Clang 17 toolchain..."
        
        # Method 1: Try with Clang 17
        make -j$(nproc) \
          ARCH=arm64 \
          CC=$(pwd)/clang-17/bin/clang \
          LD=$(pwd)/clang-17/bin/ld.lld \
          AR=$(pwd)/clang-17/bin/llvm-ar \
          NM=$(pwd)/clang-17/bin/llvm-nm \
          OBJCOPY=$(pwd)/clang-17/bin/llvm-objcopy \
          OBJDUMP=$(pwd)/clang-17/bin/llvm-objdump \
          STRIP=$(pwd)/clang-17/bin/llvm-strip \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1 \
          LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu-
        
        # Check if build succeeded
        if [ -f "arch/arm64/boot/Image.gz" ]; then
          echo "✅ Kernel build SUCCESSFUL with Clang 17!"
          ls -lh arch/arm64/boot/Image.gz
        else
          echo "⚠️ Clang 17 failed, trying alternative..."
          
          # Method 2: Try with GCC only (no Clang)
          make clean
          make ARCH=arm64 $KERNEL_CONFIG
          make -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu-
            
          if [ -f "arch/arm64/boot/Image.gz" ]; then
            echo "✅ Kernel build SUCCESSFUL with GCC!"
          else
            echo "❌ All build methods failed"
            exit 1
          fi
        fi

    - name: Create flashable ZIP
      run: |
        echo "📦 Creating flashable package..."
        
        # Download AnyKernel3
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1
        
        # Copy kernel image
        cp arch/arm64/boot/Image.gz AnyKernel3/
        
        # Create anykernel.sh for S20 FE
        echo '#!/bin/bash' > AnyKernel3/anykernel.sh
        echo '' >> AnyKernel3/anykernel.sh
        echo '# AnyKernel3 Script for Samsung S20 FE' >> AnyKernel3/anykernel.sh
        echo '' >> AnyKernel3/anykernel.sh
        echo '## AnyKernel setup' >> AnyKernel3/anykernel.sh
        echo 'kernel.string=BlazeX Kernel' >> AnyKernel3/anykernel.sh
        echo 'do.devicecheck=1' >> AnyKernel3/anykernel.sh
        echo 'do.modules=0' >> AnyKernel3/anykernel.sh
        echo 'do.systemless=1' >> AnyKernel3/anykernel.sh
        echo 'do.cleanup=1' >> AnyKernel3/anykernel.sh
        echo 'device.name1=r8q' >> AnyKernel3/anykernel.sh
        echo 'device.name2=r8s' >> AnyKernel3/anykernel.sh
        echo '' >> AnyKernel3/anykernel.sh
        echo '## AnyKernel install' >> AnyKernel3/anykernel.sh
        echo '. tools/ak3-core.sh' >> AnyKernel3/anykernel.sh
        echo '' >> AnyKernel3/anykernel.sh
        echo '# Device detection' >> AnyKernel3/anykernel.sh
        echo 'case "$(getprop ro.product.device)" in' >> AnyKernel3/anykernel.sh
        echo '  "r8q"|"r8s")' >> AnyKernel3/anykernel.sh
        echo '    ui_print "Installing for Galaxy S20 FE...";' >> AnyKernel3/anykernel.sh
        echo '    block=/dev/block/bootdevice/by-name/boot;' >> AnyKernel3/anykernel.sh
        echo '    ;;' >> AnyKernel3/anykernel.sh
        echo '  *)' >> AnyKernel3/anykernel.sh
        echo '    abort "Unsupported device!";' >> AnyKernel3/anykernel.sh
        echo '    ;;' >> AnyKernel3/anykernel.sh
        echo 'esac' >> AnyKernel3/anykernel.sh
        echo '' >> AnyKernel3/anykernel.sh
        echo 'dump_boot;' >> AnyKernel3/anykernel.sh
        echo 'write_boot;' >> AnyKernel3/anykernel.sh
        echo '' >> AnyKernel3/anykernel.sh
        echo 'ui_print "BlazeX Kernel installed successfully!";' >> AnyKernel3/anykernel.sh
        echo 'ui_print "Reboot to enjoy enhanced performance!";' >> AnyKernel3/anykernel.sh
        
        chmod +x AnyKernel3/anykernel.sh
        
        # Create version info
        echo "BlazeX Kernel for Samsung Galaxy S20 FE" > AnyKernel3/version
        echo "Build date: $(date)" >> AnyKernel3/version
        echo "Git commit: ${{ github.sha }}" >> AnyKernel3/version
        echo "Defconfig: ${{ steps.find-config.outputs.DEFCONFIG }}" >> AnyKernel3/version
        
        # Create ZIP
        cd AnyKernel3
        zip -r9 ../blazex-s20fe-$(date +%Y%m%d-%H%M).zip *
        
        echo "✅ Flashable ZIP created!"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-${{ github.sha }}
        path: |
          *.zip
          arch/arm64/boot/Image.gz
        retention-days: 7

    - name: Build success
      if: success()
      run: |
        echo ""
        echo "╔══════════════════════════════════════╗"
        echo "║        🎉 BUILD SUCCESSFUL! 🎉       ║"
        echo "╠══════════════════════════════════════╣"
        echo "║                                      ║"
        echo "║  ✅ Compiled on GitHub Actions       ║"
        echo "║  ✅ Fixed toolchain issue            ║"
        echo "║  ✅ Flashable ZIP ready              ║"
        echo "║                                      ║"
        echo "║  📥 Download from 'Artifacts' below  ║"
        echo "║                                      ║"
        echo "╚══════════════════════════════════════╝"
