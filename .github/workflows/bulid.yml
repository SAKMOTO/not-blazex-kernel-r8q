name: Build Samsung S20 FE Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: not_defconfig

    steps:
    - name: 📥 Checkout source
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1

    - name: 🛠 Install build dependencies (CORRECT TOOLCHAIN)
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential curl flex git \
          libelf-dev libssl-dev libncurses5-dev lz4 \
          python3 python3-pip zip \
          llvm clang lld \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

        echo "🔎 Toolchain versions:"
        clang --version
        ld.lld --version
        aarch64-linux-gnu-gcc --version

    - name: 🧹 Clean kernel source
      run: |
        make clean || true
        make mrproper || true

    - name: ⚙️ Load defconfig
      run: |
        echo "Using defconfig: $DEFCONFIG"
        ls arch/arm64/configs/$DEFCONFIG
        make $DEFCONFIG

    - name: 🔨 Build kernel (LLVM / Clang)
      run: |
        make -j$(nproc) \
          ARCH=arm64 \
          CC=clang \
          LD=ld.lld \
          LLVM=1 \
          LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        if [ ! -f arch/arm64/boot/Image.gz ]; then
          echo "❌ Kernel build failed (Image.gz not found)"
          exit 1
        fi

        echo "✅ Kernel Image built successfully"
        ls -lh arch/arm64/boot/Image.gz

    - name: 📦 Create flashable AnyKernel3 ZIP
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1

        cp arch/arm64/boot/Image.gz AnyKernel3/

        cat << 'EOF' > AnyKernel3/anykernel.sh
        #!/bin/bash

        kernel.string=BlazeX Kernel
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1

        device.name1=r8q
        device.name2=r8s

        . tools/ak3-core.sh

        case "$(getprop ro.product.device)" in
          r8q|r8s)
            ui_print "Installing BlazeX Kernel for Galaxy S20 FE"
            block=/dev/block/by-name/boot
            ;;
          *)
            abort "Unsupported device!"
            ;;
        esac

        dump_boot
        write_boot

        ui_print "BlazeX Kernel installed successfully!"
        EOF

        chmod +x AnyKernel3/anykernel.sh

        echo "BlazeX Kernel - Samsung Galaxy S20 FE" > AnyKernel3/version
        echo "Build date: $(date)" >> AnyKernel3/version
        echo "Commit: $GITHUB_SHA" >> AnyKernel3/version
        echo "Defconfig: $DEFCONFIG" >> AnyKernel3/version

        cd AnyKernel3
        zip -r9 ../BlazeX-S20FE-$(date +%Y%m%d-%H%M).zip *

    - name: ⬆️ Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BlazeX-Kernel-S20FE
        path: |
          *.zip
          arch/arm64/boot/Image.gz
        retention-days: 7

    - name: 🎉 Build finished
      run: |
        echo "======================================"
        echo " ✅ Kernel build SUCCESSFUL"
        echo " 📦 Flashable ZIP uploaded"
        echo "======================================"
