name: Build Samsung S20 FE Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: not_defconfig

    steps:
    - name: 📥 Checkout source
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1

    - name: 🛠 Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential curl flex git \
          libelf-dev libssl-dev libncurses-dev \
          python3 python3-pip zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          clang lld binutils-aarch64-linux-gnu

        echo "Tool versions:"
        clang --version
        aarch64-linux-gnu-gcc --version
        ld.bfd --version

    - name: 🧹 Clean kernel tree
      run: |
        make mrproper

    - name: ⚙️ Load defconfig
      run: |
        make $DEFCONFIG

    - name: 🔧 Fix Samsung CI config (NO menuconfig)
      run: |
        scripts/config --disable CONFIG_EFI
        scripts/config --disable CONFIG_EFI_STUB
        scripts/config --disable CONFIG_QCLD
        scripts/config --disable CONFIG_LTO
        scripts/config --disable CONFIG_CFI_CLANG
        scripts/config --disable CONFIG_FTRACE
        scripts/config --disable CONFIG_FUNCTION_TRACER
        scripts/config --disable CONFIG_DYNAMIC_FTRACE

        scripts/config --enable CONFIG_ARM64
        scripts/config --enable CONFIG_MODULES

        make olddefconfig

    - name: 🔨 Build kernel (SAFE MODE)
      run: |
        make -j$(nproc) \
          ARCH=arm64 \
          CC=clang \
          LD=ld.bfd \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          KCFLAGS="-fno-pic"

    - name: ✅ Verify kernel image
      run: |
        if [ ! -f arch/arm64/boot/Image.gz ]; then
          echo "❌ Image.gz not found"
          exit 1
        fi
        ls -lh arch/arm64/boot/Image.gz

    - name: 📦 Create AnyKernel3 ZIP
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1
        cp arch/arm64/boot/Image.gz AnyKernel3/

        cat << 'EOF' > AnyKernel3/anykernel.sh
        #!/bin/bash
        kernel.string=BlazeX Kernel
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1

        device.name1=r8q
        device.name2=r8s

        . tools/ak3-core.sh

        case "$(getprop ro.product.device)" in
          r8q|r8s)
            block=/dev/block/by-name/boot
            ;;
          *)
            abort "Unsupported device"
            ;;
        esac

        dump_boot
        write_boot
        EOF

        chmod +x AnyKernel3/anykernel.sh
        cd AnyKernel3
        zip -r9 ../BlazeX-S20FE-$(date +%Y%m%d-%H%M).zip *

    - name: ⬆️ Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BlazeX-Kernel-S20FE
        path: |
          BlazeX-S20FE-*.zip
          arch/arm64/boot/Image.gz
        retention-days: 7
