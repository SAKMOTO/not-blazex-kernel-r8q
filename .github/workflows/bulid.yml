name: Build Samsung S20 FE Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install required tools (WITH LLD THIS TIME)
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          clang \
          lld \
          llvm \
          python3 \
          python-is-python3
        
        # Verify LLD is installed
        which ld.lld
        ld.lld --version

    - name: Build everything (FORCE VDSO DISABLE)
      run: |
        # Clean first
        make clean
        make mrproper
        
        # Load defconfig
        make ARCH=arm64 not_defconfig
        
        # MANUALLY EDIT .config to FORCE VDSO OFF
        echo "========================================="
        echo "FORCING VDSO DISABLE IN .config"
        echo "========================================="
        
        # Backup original .config
        cp .config .config.backup
        
        # Use sed to FORCE disable VDSO (more reliable than scripts/config)
        sed -i 's/CONFIG_ARM64_VDSO=y/CONFIG_ARM64_VDSO=n/g' .config
        sed -i 's/CONFIG_COMPAT_VDSO=y/CONFIG_COMPAT_VDSO=n/g' .config
        
        # Also disable other problematic configs
        sed -i 's/CONFIG_EFI=y/CONFIG_EFI=n/g' .config
        sed -i 's/CONFIG_EFI_STUB=y/CONFIG_EFI_STUB=n/g' .config
        sed -i 's/CONFIG_QCLD=y/CONFIG_QCLD=n/g' .config
        
        # FORCE disable initramfs if rcSTPD error appears
        sed -i 's/CONFIG_BLK_DEV_INITRD=y/CONFIG_BLK_DEV_INITRD=n/g' .config
        sed -i 's/CONFIG_INITRAMFS_SOURCE=.*/CONFIG_INITRAMFS_SOURCE=""/g' .config
        
        # Show what we changed
        echo "Checking VDSO status after edit:"
        grep "CONFIG_ARM64_VDSO" .config
        grep "CONFIG_COMPAT_VDSO" .config
        
        # Update dependencies
        make ARCH=arm64 olddefconfig
        
        # Build kernel
        make -j$(nproc) \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Verify image
      run: |
        if [ -f arch/arm64/boot/Image ]; then
          echo "✅ Kernel build successful"
          ls -lh arch/arm64/boot/Image
        elif [ -f arch/arm64/boot/Image.gz ]; then
          echo "✅ Kernel build successful (Image.gz)"
          ls -lh arch/arm64/boot/Image.gz
        else
          echo "❌ Build failed - no kernel image found"
          echo "Last 50 lines of build log:"
          tail -50 build.log 2>/dev/null || echo "No build.log"
          exit 1
        fi

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1
        if [ -f arch/arm64/boot/Image ]; then
          cp arch/arm64/boot/Image AnyKernel3/
        elif [ -f arch/arm64/boot/Image.gz ]; then
          cp arch/arm64/boot/Image.gz AnyKernel3/
        fi
        cd AnyKernel3
        zip -r9 ../kernel.zip *

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-artifacts
        path: |
          kernel.zip
          arch/arm64/boot/Image*
        retention-days: 7
