name: Build Samsung S20 FE Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: not_defconfig

    steps:
    - name: 📥 Checkout source
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1

    - name: 🛠 Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential curl flex git \
          libelf-dev libssl-dev libncurses-dev \
          python3 python3-pip zip \
          clang lld llvm \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

        which ld.lld
        ld.lld --version
        clang --version

    - name: 🧹 Clean kernel
      run: |
        make mrproper

    - name: ⚙️ Load defconfig
      run: |
        make $DEFCONFIG

    - name: 🔧 Disable problematic Samsung options
      run: |
        scripts/config --disable CONFIG_EFI
        scripts/config --disable CONFIG_EFI_STUB
        scripts/config --disable CONFIG_QCLD
        scripts/config --disable CONFIG_LTO
        scripts/config --disable CONFIG_CFI_CLANG
        scripts/config --disable CONFIG_FTRACE
        scripts/config --disable CONFIG_FUNCTION_TRACER
        scripts/config --disable CONFIG_DYNAMIC_FTRACE
        make olddefconfig

    - name: 🔨 Build kernel (LLVM – SAFE)
      run: |
        make -j$(nproc) \
          ARCH=arm64 \
          CC=clang \
          LD=ld.lld \
          LLVM=1 \
          LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: ✅ Verify Image
      run: |
        ls -lh arch/arm64/boot/Image.gz

    - name: 📦 AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1
        cp arch/arm64/boot/Image.gz AnyKernel3/
        cd AnyKernel3
        zip -r9 ../BlazeX-S20FE.zip *

    - name: ⬆️ Upload
      uses: actions/upload-artifact@v4
      with:
        name: BlazeX-Kernel
        path: |
          BlazeX-S20FE.zip
          arch/arm64/boot/Image.gz
