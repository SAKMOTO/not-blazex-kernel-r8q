name: Build Samsung S20 FE Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install required tools
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          python3 \
          python-is-python3

    - name: Clean kernel
      run: |
        make clean
        make mrproper

    - name: Load defconfig (using not_defconfig)
      run: |
        make not_defconfig

    - name: Fix config (disable EFI and QCLD)
      run: |
        scripts/config --disable CONFIG_EFI
        scripts/config --disable CONFIG_EFI_STUB
        scripts/config --disable CONFIG_QCLD
        make olddefconfig

    - name: Build kernel
      run: |
        make -j$(nproc) \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Verify image
      run: |
        if [ -f arch/arm64/boot/Image ]; then
          echo "✅ Kernel build successful"
          ls -lh arch/arm64/boot/Image
        else
          echo "❌ Build failed"
          exit 1
        fi

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1
        cp arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        zip -r9 ../kernel.zip *

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-artifacts
        path: |
          kernel.zip
          arch/arm64/boot/Image
