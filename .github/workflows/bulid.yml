name: Build Samsung Galaxy S20 FE Kernel (BlazeX)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: not_defconfig

    steps:
    - name: 📥 Checkout kernel source
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1

    - name: 🛠 Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential curl flex git \
          libelf-dev libssl-dev libncurses5-dev lz4 \
          python3 python3-pip zip \
          clang llvm lld \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

        clang --version
        ld.lld --version

    - name: 🧹 Clean source
      run: |
        make clean || true
        make mrproper || true

    - name: ⚙️ Load defconfig
      run: |
        make $DEFCONFIG

    - name: 🔨 Build kernel
      run: |
        make -j$(nproc) \
          ARCH=arm64 \
          CC=clang \
          LLVM=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        test -f arch/arm64/boot/Image.gz

    - name: 📦 Package AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1
        cp arch/arm64/boot/Image.gz AnyKernel3/

        printf '%s\n' \
        '#!/bin/bash' \
        '' \
        'kernel.string=BlazeX Kernel' \
        'do.devicecheck=1' \
        'do.modules=0' \
        'do.systemless=1' \
        'do.cleanup=1' \
        '' \
        'device.name1=r8q' \
        'device.name2=r8s' \
        '' \
        '. tools/ak3-core.sh' \
        '' \
        'case "$(getprop ro.product.device)" in' \
        '  r8q|r8s)' \
        '    ui_print "Installing BlazeX Kernel for Galaxy S20 FE"' \
        '    block=/dev/block/by-name/boot' \
        '    ;;' \
        '  *) abort "Unsupported device!" ;;' \
        'esac' \
        '' \
        'dump_boot' \
        'write_boot' \
        '' \
        'ui_print "BlazeX Kernel installed successfully!"' \
        > AnyKernel3/anykernel.sh

        chmod +x AnyKernel3/anykernel.sh

        cd AnyKernel3
        zip -r9 ../BlazeX-S20FE.zip *

    - name: ⬆️ Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BlazeX-Kernel-S20FE
        path: |
          BlazeX-S20FE.zip
          arch/arm64/boot/Image.gz
