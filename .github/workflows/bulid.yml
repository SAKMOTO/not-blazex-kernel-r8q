name: Build Samsung S20 FE Kernel (GCC)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      ARCH: arm64
      SUBARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      DEFCONFIG: not_defconfig

    steps:
    - name: 📥 Checkout source
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1

    - name: 🛠 Install build dependencies (GCC ONLY)
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential curl flex git \
          libelf-dev libssl-dev libncurses-dev \
          python3 python-is-python3 zip \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu

        aarch64-linux-gnu-gcc --version
        aarch64-linux-gnu-ld --version

    - name: 🧹 Clean kernel
      run: |
        make mrproper

    - name: ⚙️ Load defconfig
      run: |
        make $DEFCONFIG

    - name: 🔨 Build kernel (GCC – STABLE)
      run: |
        make -j$(nproc)

    - name: ✅ Verify Image
      run: |
        ls -lh arch/arm64/boot/Image || exit 1

    - name: 📦 Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1
        cp arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        zip -r9 ../BlazeX-S20FE.zip *

    - name: ⬆️ Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BlazeX-Kernel
        path: |
          BlazeX-S20FE.zip
          arch/arm64/boot/Image
