name: Build Samsung S20 FE Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install required tools
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          python3 \
          python-is-python3

    - name: Build everything (SIMPLE AND WORKING)
      run: |
        # Clean first
        make clean
        make mrproper
        
        # Load defconfig
        make ARCH=arm64 not_defconfig
        
        # USE A SIMPLE SCRIPT TO FIX .config
        cat > fix_config.py << 'EOF'
#!/usr/bin/env python3
import re

with open('.config', 'r') as f:
    content = f.read()

# Disable problematic configs
replacements = [
    ('CONFIG_ARM64_VDSO=y', 'CONFIG_ARM64_VDSO=n'),
    ('CONFIG_COMPAT_VDSO=y', 'CONFIG_COMPAT_VDSO=n'),
    ('CONFIG_EFI=y', 'CONFIG_EFI=n'),
    ('CONFIG_EFI_STUB=y', 'CONFIG_EFI_STUB=n'),
    ('CONFIG_QCLD=y', 'CONFIG_QCLD=n'),
    ('CONFIG_BLK_DEV_INITRD=y', 'CONFIG_BLK_DEV_INITRD=n'),
]

for old, new in replacements:
    content = content.replace(old, new)

# Remove any initramfs source
content = re.sub(r'CONFIG_INITRAMFS_SOURCE=.*', 'CONFIG_INITRAMFS_SOURCE=""', content)

with open('.config', 'w') as f:
    f.write(content)

print("Config fixed successfully")
EOF
        
        python3 fix_config.py
        
        # Verify changes
        echo "Checking VDSO is disabled:"
        grep "CONFIG_ARM64_VDSO" .config || echo "VDSO config not found"
        
        # Update config
        make ARCH=arm64 olddefconfig
        
        # Build kernel
        make -j$(nproc) \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- 2>&1 | tee build.log

    - name: Verify image
      run: |
        if [ -f arch/arm64/boot/Image ]; then
          echo "✅ Kernel build successful"
          ls -lh arch/arm64/boot/Image
        elif [ -f arch/arm64/boot/Image.gz ]; then
          echo "✅ Kernel build successful (Image.gz)"
          ls -lh arch/arm64/boot/Image.gz
        else
          echo "❌ Build failed"
          echo "Last 20 lines of build log:"
          tail -20 build.log
          exit 1
        fi

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1
        if [ -f arch/arm64/boot/Image ]; then
          cp arch/arm64/boot/Image AnyKernel3/
        elif [ -f arch/arm64/boot/Image.gz ]; then
          cp arch/arm64/boot/Image.gz AnyKernel3/
        fi
        cd AnyKernel3
        zip -r9 ../kernel.zip *

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-artifacts
        path: |
          kernel.zip
          arch/arm64/boot/Image*
        retention-days: 7
