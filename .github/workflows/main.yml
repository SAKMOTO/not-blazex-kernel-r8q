name: Build S20 FE Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        submodules: true
    
    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential curl flex git libelf-dev \
          libssl-dev libncurses5-dev lz4 python3 python3-pip \
          wget gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi zip
    
    - name: Find correct defconfig
      id: find-config
      run: |
        echo "🔍 Auto-detecting defconfig..."
        
        # Common S20 FE defconfig patterns
        CONFIGS=()
        
        # Check various possible locations
        if [ -f "arch/arm64/configs/vendor/sm7225_sec_defconfig" ]; then
          CONFIGS+=("vendor/sm7225_sec_defconfig")
        fi
        
        if [ -f "arch/arm64/configs/vendor/r8q_defconfig" ]; then
          CONFIGS+=("vendor/r8q_defconfig")
        fi
        
        if [ -f "arch/arm64/configs/sm7225_sec_defconfig" ]; then
          CONFIGS+=("sm7225_sec_defconfig")
        fi
        
        if [ -f "arch/arm64/configs/exynos9830_defconfig" ]; then
          CONFIGS+=("exynos9830_defconfig")
        fi
        
        # List all defconfigs if none found
        if [ ${#CONFIGS[@]} -eq 0 ]; then
          echo "Listing all available defconfigs:"
          find arch/arm64/configs -name "*defconfig" 2>/dev/null | head -20
          # Use the first one found
          FIRST_CONFIG=$(find arch/arm64/configs -name "*defconfig" 2>/dev/null | head -1)
          if [ -n "$FIRST_CONFIG" ]; then
            CONFIGS+=("$FIRST_CONFIG")
          fi
        fi
        
        # Set output
        if [ ${#CONFIGS[@]} -gt 0 ]; then
          echo "Found configs: ${CONFIGS[@]}"
          echo "DEFCONFIG=${CONFIGS[0]}" >> $GITHUB_OUTPUT
          echo "Using: ${CONFIGS[0]}"
        else
          echo "ERROR: No defconfig found!"
          exit 1
        fi
    
    - name: Download Proton Clang
      run: |
        echo "📥 Downloading Proton Clang..."
        mkdir -p toolchain
        cd toolchain
        # Clone proton-clang (Samsung kernels work best with this)
        git clone https://github.com/kdrag0n/proton-clang.git --depth=1 || \
        git clone https://gitlab.com/ix5/proton-clang.git --depth=1
        echo "✅ Toolchain ready"
    
    - name: Download AnyKernel3
      run: |
        echo "📦 Getting AnyKernel3..."
        git clone https://github.com/osm0sis/AnyKernel3.git --depth=1
        # Create basic anykernel.sh if missing
        if [ ! -f "AnyKernel3/anykernel.sh" ]; then
          cat > AnyKernel3/anykernel.sh << 'EOF'
#!/bin/bash
# AnyKernel3 Ramdisk Mod Script
# osm0sis @ xda-developers

## AnyKernel setup
properties() { '
kernel.string=BlazeX Kernel
do.devicecheck=0
do.modules=0
do.systemless=1
do.cleanup=1
'; }

. tools/ak3-core.sh;

dump_boot;
write_boot;
EOF
        fi
    
    - name: Build kernel
      env:
        DEFCONFIG: ${{ steps.find-config.outputs.DEFCONFIG }}
      run: |
        echo "🚀 Starting kernel build..."
        echo "Using defconfig: $DEFCONFIG"
        
        # Set environment
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Show current directory
        echo "Current dir: $(pwd)"
        ls -la
        
        # Clean
        echo "Cleaning previous builds..."
        make clean || echo "Clean failed, continuing..."
        make mrproper || echo "Mrproper failed, continuing..."
        
        # Create out directory
        mkdir -p out
        
        # Load config
        echo "Loading defconfig: $DEFCONFIG"
        make O=out $DEFCONFIG
        
        # Build kernel
        echo "Compiling with $(nproc) CPU cores..."
        
        # Try with Proton Clang
        time make -j$(nproc) O=out \
          CC=$(pwd)/toolchain/proton-clang/bin/clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          STRIP=llvm-strip \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1 \
          LLVM_IAS=1
        
        # Check if build succeeded
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
          echo "✅ Kernel build SUCCESSFUL!"
          ls -lh out/arch/arm64/boot/Image.gz
          BUILD_SIZE=$(stat -c%s "out/arch/arm64/boot/Image.gz")
          echo "Kernel size: $((BUILD_SIZE / 1024 / 1024)) MB"
        else
          echo "❌ Kernel build FAILED"
          echo "Checking output:"
          find out -name "*.o" 2>/dev/null | head -5 || true
          echo "Trying alternative build method..."
          
          # Try without O=out
          make clean
          make $DEFCONFIG
          make -j$(nproc) \
            CC=$(pwd)/toolchain/proton-clang/bin/clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1
            
          if [ -f "arch/arm64/boot/Image.gz" ]; then
            echo "✅ Build succeeded without O=out!"
            mkdir -p out/arch/arm64/boot
            cp arch/arm64/boot/Image.gz out/arch/arm64/boot/
          else
            exit 1
          fi
        fi
    
    - name: Create flashable ZIP
      run: |
        echo "📦 Packaging kernel..."
        
        # Copy kernel image
        KERNEL_IMAGE="out/arch/arm64/boot/Image.gz"
        if [ ! -f "$KERNEL_IMAGE" ]; then
          KERNEL_IMAGE="arch/arm64/boot/Image.gz"
        fi
        
        cp "$KERNEL_IMAGE" AnyKernel3/Image.gz
        
        # Copy modules if exist
        if [ -d "out/lib/modules" ]; then
          echo "Copying modules..."
          mkdir -p AnyKernel3/modules
          find out/lib/modules -name "*.ko" -exec cp {} AnyKernel3/modules/ \;
        fi
        
        # Create version file
        cat > AnyKernel3/version << EOF
        ╔═══════════════════════════════╗
        ║    BlazeX Kernel for S20 FE   ║
        ╚═══════════════════════════════╝
        
        Build Date: $(date)
        Git Commit: ${{ github.sha_short }}
        Defconfig: ${{ steps.find-config.outputs.DEFCONFIG }}
        Built on: GitHub Actions
        
        📱 Device: Samsung Galaxy S20 FE
        🔧 Toolchain: Proton Clang
        
        Flash in custom recovery (TWRP/OFox)
        EOF
        
        # Create ZIP
        cd AnyKernel3
        ZIP_NAME="BlazeX-S20FE-$(date +%Y%m%d-%H%M).zip"
        zip -r9 "../$ZIP_NAME" *
        
        echo "✅ ZIP created: $ZIP_NAME"
        ls -lh "../$ZIP_NAME"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-${{ github.sha_short }}
        path: |
          *.zip
          out/arch/arm64/boot/Image.gz
          arch/arm64/boot/Image.gz
        retention-days: 7
    
    - name: Success message
      if: success()
      run: |
        echo "=========================================="
        echo "🎉 KERNEL BUILD COMPLETE!"
        echo "=========================================="
        echo ""
        echo "✅ Built on GitHub's servers"
        echo "✅ Zero storage used on your computer"
        echo "✅ Flashable ZIP ready to download"
        echo ""
        echo "📥 DOWNLOAD INSTRUCTIONS:"
        echo "1. Go to 'Actions' tab"
        echo "2. Click this workflow run"
        echo "3. Scroll to 'Artifacts' section"
        echo "4. Download 'kernel-build-[commit]'"
        echo ""
        echo "⚡ Flash via TWRP/OrangeFox recovery"
        echo "=========================================="
