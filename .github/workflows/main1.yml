name: Build S20 FE Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install build tools
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential curl flex git
        sudo apt install -y libelf-dev libssl-dev libncurses5-dev lz4
        sudo apt install -y python3 wget gcc-aarch64-linux-gnu zip

    - name: Find defconfig
      id: find-config
      run: |
        echo "Searching for defconfig files..."
        
        # List available defconfigs
        find arch/arm64/configs -name "*defconfig" 2>/dev/null || echo "No configs found"
        
        # Try to auto-detect
        if [ -f "arch/arm64/configs/sm7225-sec_defconfig" ]; then
          echo "CONFIG=sm7225-sec_defconfig" >> $GITHUB_OUTPUT
        elif [ -f "arch/arm64/configs/vendor/sm7225-sec_defconfig" ]; then
          echo "CONFIG=vendor/sm7225-sec_defconfig" >> $GITHUB_OUTPUT
        elif [ -f "arch/arm64/configs/vendor/r8q_defconfig" ]; then
          echo "CONFIG=vendor/r8q_defconfig" >> $GITHUB_OUTPUT
        else
          # Use first found
          FIRST_CONFIG=$(find arch/arm64/configs -name "*defconfig" 2>/dev/null | head -1)
          if [ -n "$FIRST_CONFIG" ]; then
            CONFIG_NAME=${FIRST_CONFIG#arch/arm64/configs/}
            echo "CONFIG=$CONFIG_NAME" >> $GITHUB_OUTPUT
          else
            echo "ERROR: No defconfig found"
            exit 1
          fi
        fi

    - name: Build kernel
      env:
        KERNEL_CONFIG: ${{ steps.find-config.outputs.CONFIG }}
      run: |
        echo "Building with config: $KERNEL_CONFIG"
        
        # Clean previous builds
        make clean 2>/dev/null || true
        
        # Load configuration
        make $KERNEL_CONFIG
        
        # Compile kernel
        make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
        
        # Check if successful
        if [ -f "arch/arm64/boot/Image.gz" ]; then
          echo "✅ Kernel build successful!"
          ls -lh arch/arm64/boot/Image.gz
        else
          echo "❌ Kernel build failed"
          exit 1
        fi

    - name: Create flashable ZIP
      run: |
        echo "Creating flashable package..."
        
        # Download AnyKernel3
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1
        
        # Copy kernel image
        cp arch/arm64/boot/Image.gz AnyKernel3/
        
        # Create basic anykernel script
        cat > AnyKernel3/anykernel.sh << 'EOF'
#!/bin/bash
. tools/ak3-core.sh
dump_boot
write_boot
ui_print "BlazeX Kernel installed!"
EOF
        
        chmod +x AnyKernel3/anykernel.sh
        
        # Create ZIP file
        cd AnyKernel3
        zip -r9 ../blazex-kernel-s20fe.zip *
        
        echo "✅ ZIP created: blazex-kernel-s20fe.zip"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-package
        path: |
          *.zip
          arch/arm64/boot/Image.gz

    - name: Build completed
      if: success()
      run: |
        echo ""
        echo "══════════════════════════════════════════"
        echo "   🎉 KERNEL BUILD SUCCESSFUL! 🎉"
        echo "══════════════════════════════════════════"
        echo ""
        echo "✅ Built on GitHub servers"
        echo "✅ Zero local storage used"
        echo "✅ Flashable ZIP ready"
        echo ""
        echo "📥 Download from 'Artifacts' section"
        echo "⚡ Flash via TWRP/OrangeFox recovery"
        echo "══════════════════════════════════════════"
